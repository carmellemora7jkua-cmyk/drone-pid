jobs:
  Psi_grad:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate baseline E
          command: |
            mkdir -p /tmp/sprout
            set +o pipefail 2>/dev/null; echo "" > /tmp/sprout/exp_019; seq 1 699386 >> /tmp/sprout/exp_019; true
            stat -c '%s' /tmp/sprout/exp_019 | awk '{print "s3",$1}'
      - persist_to_workspace:
          root: /tmp/sprout
          paths:
            - 'exp_019'
  vb-2a:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/sprout
      - run:
          name: Measure handoff
          command: |
            printf '%.3fs\n' "$(echo "scale=3; $(wc -c < /tmp/sprout/exp_019) / 1000" | bc 2>/dev/null)" || true
      - run:
          name: Clone workspace
          command: git clone --quiet --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll archive
          command: tar -xzvf core-binaries-v5.tgz
      - run:
          name: Record build info
          command: /bin/sleep 30
      - run:
          command: ./cache-03
